services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musicdb_pass}
      POSTGRES_DB: ${POSTGRES_DB:-musicdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    command: sh -c "alembic -x seed=1 upgrade head && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
    volumes:
      - media_data:/app/audio
    environment:
      APP_ENV: ${APP_ENV:-development}
      MEDIA_DIR: /app/audio
      COOLLOG56_PASSWORD: ${COOLLOG56_PASSWORD:-}
      LOG42_PASSWORD: ${LOG42_PASSWORD:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-musicdb}:${POSTGRES_PASSWORD:-musicdb_pass}@db:5432/${POSTGRES_DB:-musicdb}
      JWT_SECRET: ${JWT_SECRET:-[REPLACED]}
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    environment:
      BACKEND_PORT: ${PORT:-8000}
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
